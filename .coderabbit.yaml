# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_instructions:
    - path: '**/*.cs'
      instructions: >-
        Follow AGENTS.md. Check resource ownership, cancellation, bounded network parsing/buffering,
        DVB/RTSP correctness, recording durability, DST and timezone behavior, and UI-thread safety.
        Require meaningful behavior tests. Do not suggest weakening nullable/analyzer warning gates.
    - path: '.github/workflows/**'
      instructions: >-
        Never execute fork PR code on the privileged Windows VM runner. Desktop jobs must be
        serialized and run only against trusted main revisions. Keep actions pinned to commit SHAs.
