name: Draft release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version without v prefix'
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ inputs.version || github.ref_name }}

  draft:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: packages
      - name: Checksums
        run: (cd packages && sha256sum ./*.deb ./*.exe > SHA256SUMS)
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          files: packages/*
