name: Build release packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Validate version
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$') { throw 'Expected a semantic version.' }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Restore, build, test
        timeout-minutes: 10
        shell: pwsh
        run: |
          dotnet restore --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build --no-restore -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --no-build -c Release
          exit $LASTEXITCODE
      - name: Linux package
        if: runner.os == 'Linux'
        run: bash packaging/build-deb.sh "$APP_VERSION"
      - name: Install pinned Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Inno Setup checksum mismatch.' }
          if ((Get-AuthenticodeSignature $installer).Status -ne 'Valid') { throw 'Invalid installer signature.' }
          $process = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/ALLUSERS' -PassThru -Wait
          if ($process.ExitCode -notin @(0,3010)) { throw "Installer failed: $($process.ExitCode)" }
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish src/FritzTV.Desktop -c Release -r win-x64 --self-contained true --no-restore -p:Version=$env:APP_VERSION -o artifacts/publish/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./packaging/Bundle-WindowsDependencies.ps1 -PublishDirectory artifacts/publish/win-x64
          python packaging/collect-licenses.py src/FritzTV.Desktop/obj/project.assets.json artifacts/publish/win-x64/licenses --runtime win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path artifacts/packages -Force | Out-Null
          Copy-Item THIRD-PARTY-NOTICES.md artifacts/packages/windows-dependencies.txt
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DAppVersion=$env:APP_VERSION" packaging/windows.iss
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ runner.os }}
          path: |
            artifacts/packages/*.deb
            artifacts/packages/*.exe
            artifacts/packages/*.txt
          if-no-files-found: error

